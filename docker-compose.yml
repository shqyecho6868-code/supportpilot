services:
  postgres:
    # ParadeDB = Postgres + pg_search (BM25) + pgvector, needed by later retrieval work.
    image: paradedb/paradedb:0.27.0-pg17
    container_name: supportpilot-postgres
    environment:
      POSTGRES_USER: supportpilot
      POSTGRES_PASSWORD: supportpilot
      POSTGRES_DB: supportpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01_schema.sql:/docker-entrypoint-initdb.d/90_supportpilot_schema.sql:ro
      - ./db/init/02_seed.sql:/docker-entrypoint-initdb.d/91_supportpilot_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportpilot -d supportpilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: supportpilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    container_name: supportpilot-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Service hostnames inside the compose network override the localhost URLs in .env.
      DATABASE_URL: postgresql://supportpilot:supportpilot@postgres:5432/supportpilot
      REDIS_URL: redis://redis:6379/0
      MEM0_HISTORY_DB: /data/mem0_history.db
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-docker}
    ports:
      - "8000:8000"
    volumes:
      - models:/models   # fastembed models (embedding, reranker), downloaded on first start
      - appdata:/data    # mem0 history
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  models:
  appdata:
