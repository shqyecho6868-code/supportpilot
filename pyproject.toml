[project]
name = "supportpilot"
version = "0.1.0"
description = "An e-commerce customer-support agent built on Claude, LangGraph and MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "redis>=8.2.0",
    "sse-starlette>=3.7.1",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Anthropic API (skipped unless ANTHROPIC_API_KEY is set)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[project.scripts]
supportpilot = "supportpilot.api.app:main"
